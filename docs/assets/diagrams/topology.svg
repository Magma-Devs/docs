  <text x="24" y="384" class="t anim c1"><tspan class="b" fill="#E8431C">1.</tspan> A request arrives. Smart Router checks the shared cache first: not there yet.</text>
  <text x="24" y="384" class="t anim c2"><tspan class="b" fill="#E8431C">2.</tspan> It tries Provider 2, which does not answer in time, so it retries on Provider 1.</text>
