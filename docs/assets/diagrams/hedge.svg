  <text x="435.5" y="76" class="s keep tickLbl">no answer yet: hedge fires</text>
  <g class="keep win"><g class=""><circle cx="590.0" cy="186" r="11" fill="#2E8540"/><text x="590.0" y="190.5" text-anchor="middle" class="b" font-size="13" fill="#FFFFFF">&#x2713;</text></g><text x="608.0" y="191" class="s b" style="fill:#2E8540">first answer wins, goes to your app</text></g>
