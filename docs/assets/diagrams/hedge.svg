    @keyframes head { 0%, 0% { transform: translate(200px, 0px); opacity: 0; } 0.8% { transform: translate(200px, 0px); opacity: 1; } 90% { transform: translate(850px, 0px); opacity: 1; } 90.8%, 100% { transform: translate(850px, 0px); opacity: 0; } }
    .head { animation: head 10s linear infinite; }
    .head { opacity: 0; }
    @keyframes c1 { 0%, 31.5% { opacity: 1; } 32.1%, 100% { opacity: 0; } }
    .c1 { animation: c1 10s linear infinite; }
