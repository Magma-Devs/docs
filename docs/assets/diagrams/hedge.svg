<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Hedge timeline: attempt 1 goes to Provider 1 and is slow. When the tick passes with no answer, a hedge sends the same request to Provider 2. Provider 2 answers first and wins; Provider 1's late answer is thrown away.">
