  <text x="24" y="306" class="t anim c1"><tspan class="b" fill="#E8431C">1.</tspan> Attempt 1 goes to Provider 1, and the clock starts.</text>
  <text x="24" y="306" class="t anim c2"><tspan class="b" fill="#E8431C">2.</tspan> The tick passes with no answer, so a hedge sends the same request to Provider 2.</text>
  <text x="24" y="306" class="t anim c3"><tspan class="b" fill="#E8431C">3.</tspan> Provider 2 answers first. Attempt 1 is still running, but this answer wins.</text>
  <text x="24" y="306" class="t anim c4"><tspan class="b" fill="#E8431C">4.</tspan> Provider 1 answers later. Its answer is thrown away.</text>
  <text x="24" y="306" class="t still">When a request is slow, a hedge tries another provider in parallel. The first answer wins.</text>
